<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Full canvas bounds -->
  <rect x="0.5" y="0.5" width="127" height="127" fill="none" stroke="#FF69B4" stroke-opacity="0.25" stroke-width="1"/>
  <!-- 15% safe-margin guide (draw inside this) -->
  <rect x="19" y="19" width="90" height="90" fill="none" stroke="#FF69B4" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Inscribed circle guide for round icon shapes -->
  <circle cx="64" cy="64" r="45" fill="none" stroke="#7FB3FF" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- Center crosshair -->
  <line x1="64" y1="56" x2="64" y2="72" stroke="#FF69B4" stroke-opacity="0.6" stroke-width="1"/>
  <line x1="56" y1="64" x2="72" y2="64" stroke="#FF69B4" stroke-opacity="0.6" stroke-width="1"/>
</svg>
