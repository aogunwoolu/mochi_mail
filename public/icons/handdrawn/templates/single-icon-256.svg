<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Full canvas bounds -->
  <rect x="0.5" y="0.5" width="255" height="255" fill="none" stroke="#FF69B4" stroke-opacity="0.25" stroke-width="1"/>
  <!-- 15% safe-margin guide (draw inside this) -->
  <rect x="38" y="38" width="180" height="180" fill="none" stroke="#FF69B4" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="6 4"/>
  <!-- Inscribed circle guide for round icon shapes -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="#7FB3FF" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- Center crosshair -->
  <line x1="128" y1="112" x2="128" y2="144" stroke="#FF69B4" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="112" y1="128" x2="144" y2="128" stroke="#FF69B4" stroke-opacity="0.6" stroke-width="1.5"/>
</svg>
